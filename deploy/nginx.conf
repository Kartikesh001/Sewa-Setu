# Rate limiting zone: max 10 requests/second per IP for general endpoints
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
# Sensitive auth/OTP zone: max 5 requests/minute per IP
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    # ACME-challenge for Let's Encrypt SSL issuance
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP traffic to HTTPS if SSL certificates are present.
    # Note: For initial bootstrap before SSL cert issuance, the HTTP server
    # proxies directly to the backend.
    location / {
        # Uncomment following line once SSL certificate is issued:
        # return 301 https://$host$request_uri;

        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16M;
    }

    # Officer MCP Endpoint on HTTP bootstrap
    location /mcp/officer {
        proxy_pass http://officer_mcp:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering and enable chunked streaming for MCP SSE
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Citizen MCP Endpoint on HTTP bootstrap
    location /mcp {
        proxy_pass http://citizen_mcp:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering and enable chunked streaming for MCP SSE
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

